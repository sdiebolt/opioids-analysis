[project]
name = "opioids-analysis"
version = "0.1.0"
description = "Analysis of the Opioids dataset from the article 'Opioid-Specific Brain Connectivity Dynamics Distinguish Analgesia from Secondary Effects'."
authors = [
    { name = "Samuel Le Meur-Diebolt", email = "samuel@diebolt.io" },
    { name = "Jean-Charles Mariani", email = "jean-charles.mariani@cri-paris.org" },
]
dependencies = [
    "colorcet~=3.1.0",
    "h5py~=3.10.0",
    "ipykernel~=6.29.3",
    "joblib~=1.3.2",
    "jupyterlab~=4.1.4",
    "matplotlib~=3.8.3",
    "mypy~=1.8.0",
    "networkx~=3.2.1",
    "nibabel~=5.2.1",
    "nilearn==0.10.1",
    "nitime~=0.10.2",
    "numpy~=1.26.4",
    "pybids~=0.16.4",
    "ruff~=0.3.1",
    "scipy~=1.12.0",
    "statsmodels~=0.14.1",
    "tqdm~=4.66.2",
    "pandas[excel]~=2.2.1",
    "seaborn>=0.13.2",
    "ipython>=9.4.0",
    "rich>=14.0.0",
    "pyqt5>=5.15.11",
    "scikit-posthocs>=0.11.4",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
